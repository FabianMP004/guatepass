              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-reconcile-wait:*
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
            - Fn::GetAtt:
              - PasosTable
              - Arn
            - Fn::GetAtt:
              - PendientesTable
              - Arn
            - Fn::GetAtt:
              - UsuariosTable
              - Arn
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource:
            - Fn::GetAtt:
              - PasosTable
              - Arn
            - Fn::GetAtt:
              - FacturasTable
              - Arn
            - Fn::GetAtt:
              - OutboxTable
              - Arn
          - Effect: Allow
            Action: dynamodb:DeleteItem
            Resource:
              Fn::GetAtt:
              - PendientesTable
              - Arn
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
            - Fn::GetAtt:
              - EsperasTable
              - Arn
            - Fn::GetAtt:
              - PasosTable
              - Arn
          - Effect: Allow
            Action: dynamodb:PutItem
            Resource:
              Fn::GetAtt:
              - EsperasTable
              - Arn
          - Effect: Allow
            Action: dynamodb:DeleteItem
            Resource:
              Fn::GetAtt:
              - EsperasTable
              - Arn
          - Effect: Allow
            Action: states:SendTaskSuccess
            Resource: '*'
          - Effect: Allow
            Action: dynamodb:Scan
            Resource:
            - Fn::GetAtt:
              - PasosTable
              - Arn
            - Fn::GetAtt:
              - EsperasTable
              - Arn
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              Ref: EsperaRecarga
          - Effect: Allow
            Action: states:DescribeExecution
            Resource:
              Fn::Sub: arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-espera-recarga:*
  ReconcileWaitFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReconcileWaitLogs
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-reconcile-wait
      CodeUri: src/
      Handler: flujos.reconciliar.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - ReconcileWaitRole
        - Arn
      Environment:
        Variables:
          PASOS_TABLE:
            Ref: PasosTable
          PENDIENTES_TABLE:
            Ref: PendientesTable
          USUARIOS_TABLE:
            Ref: UsuariosTable
          FACTURAS_TABLE:
            Ref: FacturasTable
          OUTBOX_TABLE:
            Ref: OutboxTable
          ESPERAS_TABLE:
            Ref: EsperasTable
          STATE_MACHINE_ARN:
            Ref: EsperaRecarga
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled:
              Fn::If:
              - BillingEnabled
              - true
              - false
  HistorialLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-historial
      RetentionInDays: 14
  HistorialRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: HistorialRead
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-historial:*
          - Effect: Allow
            Action: dynamodb:Query
            Resource:
            - Fn::Sub: ${MovimientosTable.Arn}/index/PorPlaca
            - Fn::Sub: ${FacturasTable.Arn}/index/PorPlaca
            - Fn::Sub: ${PasosTable.Arn}/index/PorPlaca
  HistorialFunction:
    Type: AWS::Serverless::Function
    DependsOn: HistorialLogs
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-historial
      CodeUri: src/
      Handler: usuarios.historial.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - HistorialRole
        - Arn
      Environment:
        Variables:
          CLIENT_ID:
            Ref: UserPoolClient
          ALLOWED_ORIGIN:
            Fn::Sub: https://${PortalDistribution.DomainName}
          MOVIMIENTOS_TABLE:
            Ref: MovimientosTable
          FACTURAS_TABLE:
            Ref: FacturasTable
          PASOS_TABLE:
            Ref: PasosTable
      Events:
        Payments:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /history/payments/{placa}
            Method: get
        Invoices:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /history/invoices/{placa}
            Method: get
        OwnPasses:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /users/{placa}/passes
            Method: get
  RealtimeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-tiempo-real-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  RealtimeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${AWS::StackName}-tiempo-real
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - RealtimeDLQ
          - Arn
        maxReceiveCount: 5
  RealtimeRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: EventBus
      EventPattern:
        source:
        - guatepass.pasos
        detail-type:
        - paso.registrado
        - paso.cobrado
        - paso.pendiente
        - paso.no_registrado
        - paso.no_identificado
        - paso.facturado
      State: ENABLED
      Targets:
      - Id: TiempoReal
        Arn:
          Fn::GetAtt:
          - RealtimeQueue
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - RoutingDeliveryDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 10
          MaximumEventAgeInSeconds: 3600
  RealtimeLegacyRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName:
        Ref: EventBus
      EventPattern:
        source:
        - guatepass
        detail-type:
        - PasoRegistrado
        - CobroRealizado
        - PasoPendiente
        - PasoNoRegistrado
        - PasoNoIdentificado
        - FacturaEmitida
      State: ENABLED
      Targets:
      - Id: TiempoReal
        Arn:
          Fn::GetAtt:
          - RealtimeQueue
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - RoutingDeliveryDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 10
          MaximumEventAgeInSeconds: 3600
  RealtimeQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: RealtimeQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - RealtimeQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
              - Fn::GetAtt:
                - RealtimeRule
                - Arn
              - Fn::GetAtt:
                - RealtimeLegacyRule
                - Arn
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
  TiempoRealLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-tiempo-real
      RetentionInDays: 14
  TiempoRealRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: TiempoRealPublish
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-tiempo-real:*
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - RealtimeQueue
              - Arn
          - Effect: Allow
            Action: appsync:EventPublish
            Resource:
              Ref: PeajesNamespace
  TiempoRealFunction:
    Type: AWS::Serverless::Function
    DependsOn: TiempoRealLogs
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-tiempo-real
      CodeUri: src/
      Handler: eventos.tiempo_real.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - TiempoRealRole
        - Arn
      Environment:
        Variables:
          REALTIME_HTTP_DOMAIN:
            Fn::GetAtt:
            - RealtimeApi
            - Dns.Http
      Events:
        Messages:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - RealtimeQueue
              - Arn
            BatchSize: 5
            FunctionResponseTypes:
            - ReportBatchItemFailures
  DisputeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: DisputePermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-disputa*:*
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan, dynamodb:Query, dynamodb:TransactWriteItems]
            Resource:
            - !GetAtt UsuariosTable.Arn
            - !GetAtt MovimientosTable.Arn
            - !GetAtt DisputasTable.Arn
            - !GetAtt EsperasTable.Arn
            - !GetAtt OutboxTable.Arn
            - !Sub ${DisputasTable.Arn}/index/PorPlaca
            - !Sub ${DisputasTable.Arn}/index/PorEstado
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/guatepass/${Environment}/disputa/timeout-seconds
          - Effect: Allow
            Action: states:StartExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-espera-disputa
          - Effect: Allow
            Action: states:DescribeExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${AWS::StackName}-espera-disputa:*
          - Effect: Allow
            Action: states:SendTaskSuccess
            Resource: '*'
      - PolicyName: GuatePassDisputeConditionChecks
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: DisputeConditionChecks
            Effect: Allow
            Action:
            - dynamodb:ConditionCheckItem
            Resource:
            - Fn::GetAtt:
              - UsuariosTable
              - Arn
            - Fn::GetAtt:
              - MovimientosTable
              - Arn
  DisputeApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disputa-api
      CodeUri: src/
      Handler: disputas.api.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt DisputeRole.Arn
      Environment:
        Variables:
          CLIENT_ID: !Ref UserPoolClient
          ALLOWED_ORIGIN: !Sub https://${PortalDistribution.DomainName}
          DISPUTAS_TABLE: !Ref DisputasTable
          MOVIMIENTOS_TABLE: !Ref MovimientosTable
          USUARIOS_TABLE: !Ref UsuariosTable
          OUTBOX_TABLE: !Ref OutboxTable
          ESPERAS_TABLE: !Ref EsperasTable
          DISPUTA_TIMEOUT_PARAMETER: !Ref DisputaTimeoutParameter
          DISPUTA_STATE_MACHINE_ARN: !Ref EsperaDisputa
          OWNER_CARNET: !Ref OwnerCarnet
      Events:
        Open:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /disputes, Method: post}
        List:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: /disputes, Method: get}
        Resolve:
          Type: Api
          Properties: {RestApiId: !Ref Api, Path: '/disputes/{id}/resolve', Method: post}
  DisputeCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disputa-check
      CodeUri: src/
      Handler: disputas.resolver.check_handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt DisputeRole.Arn
      Environment:
        Variables: {DISPUTAS_TABLE: !Ref DisputasTable}
  DisputeTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disputa-token
      CodeUri: src/
      Handler: disputas.resolver.registrar_token
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt DisputeRole.Arn
      Environment:
        Variables: {DISPUTAS_TABLE: !Ref DisputasTable, ESPERAS_TABLE: !Ref EsperasTable}
  DisputeTimeoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disputa-timeout
      CodeUri: src/
      Handler: disputas.resolver.timeout_handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt DisputeRole.Arn
      Environment:
        Variables:
          DISPUTAS_TABLE: !Ref DisputasTable
          USUARIOS_TABLE: !Ref UsuariosTable
          MOVIMIENTOS_TABLE: !Ref MovimientosTable
          OUTBOX_TABLE: !Ref OutboxTable
          ESPERAS_TABLE: !Ref EsperasTable
          OWNER_CARNET: !Ref OwnerCarnet
  DisputeReconcileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-disputa-reconcile
      CodeUri: src/
      Handler: disputas.resolver.reconcile_handler
      Runtime: python3.12
      Timeout: 120
      Role: !GetAtt DisputeRole.Arn
      Environment:
        Variables:
          DISPUTAS_TABLE: !Ref DisputasTable
          USUARIOS_TABLE: !Ref UsuariosTable
          MOVIMIENTOS_TABLE: !Ref MovimientosTable
          OUTBOX_TABLE: !Ref OutboxTable
          ESPERAS_TABLE: !Ref EsperasTable
          OWNER_CARNET: !Ref OwnerCarnet
          DISPUTA_STATE_MACHINE_ARN: !Ref EsperaDisputa
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
  EsperaDisputaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeDisputeTasks
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: [!GetAtt DisputeCheckFunction.Arn, !GetAtt DisputeTokenFunction.Arn, !GetAtt DisputeTimeoutFunction.Arn]
  EsperaDisputa:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-espera-disputa
      Type: STANDARD
      DefinitionUri: statemachines/espera_disputa.asl.json
      DefinitionSubstitutions:
        DisputeCheckArn: !GetAtt DisputeCheckFunction.Arn
        DisputeTokenArn: !GetAtt DisputeTokenFunction.Arn
        DisputeTimeoutArn: !GetAtt DisputeTimeoutFunction.Arn
      Role: !GetAtt EsperaDisputaRole.Arn
  RevenueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: RevenuePermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-revenue:*
          - Effect: Allow
            Action: [dynamodb:Scan]
            Resource: [!GetAtt PeajesTable.Arn, !GetAtt MovimientosTable.Arn, !GetAtt FacturasTable.Arn]
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:TransactWriteItems]
            Resource: [!GetAtt RecaudacionTable.Arn, !GetAtt OutboxTable.Arn]
  RevenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-revenue
      CodeUri: src/
      Handler: reportes.recaudacion.handler
      Runtime: python3.12
      Timeout: 180
      MemorySize: 512
      Role: !GetAtt RevenueRole.Arn
      Environment:
        Variables:
          CLIENT_ID: !Ref UserPoolClient
          ALLOWED_ORIGIN: !Sub https://${PortalDistribution.DomainName}
          OWNER_CARNET: !Ref OwnerCarnet
          PEAJES_TABLE: !Ref PeajesTable
          MOVIMIENTOS_TABLE: !Ref MovimientosTable
          FACTURAS_TABLE: !Ref FacturasTable
          RECAUDACION_TABLE: !Ref RecaudacionTable
          OUTBOX_TABLE: !Ref OutboxTable
      Events:
        GetTolls:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /tolls
            Method: get
        GetRevenue:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /revenue
            Method: get
        GetRevenueByDate:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /revenue/{fecha}
            Method: get
  RevenueScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: scheduler.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: InvokeRevenue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt RevenueFunction.Arn
  RevenueSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${AWS::StackName}-daily-revenue
      ScheduleExpression: cron(0 6 * * ? *)
      ScheduleExpressionTimezone: America/Guatemala
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt RevenueFunction.Arn
        RoleArn: !GetAtt RevenueScheduleRole.Arn
        Input: '{}'
  PasosBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-pasos-backlog
      AlarmDescription: Acumulación de al menos 10 avisos pendientes durante un minuto.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value: !Sub ${AWS::StackName}-cola-pasos
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OutboxPublishFailureFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref OutboxPublisherLogs
      FilterPattern: PUBLICATION_FAILED
      MetricTransformations:
      - MetricNamespace: GuatePass/Observability
        MetricName: PublishFailures
        MetricValue: '1'
  PasosDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-pasos-dlq
      AlarmDescription: La DLQ de pasos tiene al menos un mensaje.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value: !Sub ${AWS::StackName}-cola-pasos-dlq
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  OutboxLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-outbox-lag
      AlarmDescription: Evento Outbox pendiente por más de 5 minutos.
      Namespace: GuatePass/Observability
      MetricName: OutboxOldestSeconds
      Dimensions:
      - Name: Stack
        Value: !Ref AWS::StackName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ObservabilityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal: {Service: lambda.amazonaws.com}
          Action: sts:AssumeRole
      Policies:
      - PolicyName: ObserveOutbox
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-observe-outbox:*
          - Effect: Allow
            Action: dynamodb:Query
            Resource: !Sub ${OutboxTable.Arn}/index/PorPendiente
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: GuatePass/Observability
  OutboxLagFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-observe-outbox
      CodeUri: src/
      Handler: observabilidad.metricas.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ObservabilityRole.Arn
      Environment:
        Variables:
          OUTBOX_TABLE: !Ref OutboxTable
          STACK_NAME: !Ref AWS::StackName
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
  ObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-observability
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API latencia y errores","region":"${AWS::Region}","metrics":[["AWS/ApiGateway","Latency","ApiName","${AWS::StackName}-api",{"stat":"p99"}],["AWS/ApiGateway","4XXError","ApiName","${AWS::StackName}-api",{"stat":"Sum"}],["AWS/ApiGateway","5XXError","ApiName","${AWS::StackName}-api",{"stat":"Sum"}]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Lambda errores y throttles","region":"${AWS::Region}","metrics":[["AWS/Lambda","Errors","FunctionName","${AWS::StackName}-webhook",{"stat":"Sum"}],["AWS/Lambda","Throttles","FunctionName","${AWS::StackName}-webhook",{"stat":"Sum"}],["AWS/Lambda","Errors","FunctionName","${AWS::StackName}-cobrar",{"stat":"Sum"}],["AWS/Lambda","Errors","FunctionName","${AWS::StackName}-disputa-timeout",{"stat":"Sum"}]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"SQS profundidad, edad y DLQ","region":"${AWS::Region}","metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AWS::StackName}-cola-pasos",{"stat":"Maximum"}],["AWS/SQS","ApproximateAgeOfOldestMessage","QueueName","${AWS::StackName}-cola-pasos",{"stat":"Maximum"}],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${AWS::StackName}-cola-pasos-dlq",{"stat":"Maximum"}]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Outbox pendiente y fallas","region":"${AWS::Region}","metrics":[["GuatePass/Observability","OutboxPendingCount","Stack","${AWS::StackName}",{"stat":"Maximum"}],["GuatePass/Observability","OutboxOldestSeconds","Stack","${AWS::StackName}",{"stat":"Maximum"}],["GuatePass/Observability","PublishFailures",{"stat":"Sum"}],["AWS/Lambda","Errors","FunctionName","${AWS::StackName}-outboxpublisher",{"stat":"Sum"}]]}},

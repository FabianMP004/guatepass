<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GuatePass · Portal</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><a class="brand" href="/">◉ GuatePass</a><span id="account"></span><button id="logout" hidden>Salir</button></header>
<main><div id="notice" role="status" aria-live="polite"></div>
<section id="login-panel" class="card"><h1>Bienvenido a GuatePass</h1><p>Ingresá con tu usuario asignado para consultar tus pasos.</p><form id="login"><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section>
<section id="driver" hidden><h1>Mis pasos</h1><p id="driver-plate"></p><div class="grid"><article class="card"><h2>Saldo</h2><strong id="balance">—</strong><form id="topup"><label>Recargar (Q)<input name="monto" inputmode="decimal" placeholder="20.00" required pattern="[0-9]+(\.[0-9]{1,2})?"></label><button>Recargar</button></form></article><article class="card"><h2>Mi TAG</h2><p id="tag-current">—</p><form id="associate"><label>Código TAG<input name="tag_id" placeholder="TAG-005" required></label><button>Asociar</button></form><button id="deactivate" class="secondary">Desactivar TAG</button></article></div>
<article class="card"><h2>Pasos y pendientes</h2><button id="reload-driver" class="secondary">Actualizar</button><div id="driver-passes"></div><button id="more-passes" class="secondary" hidden>Más pasos</button></article>
<div class="grid"><article class="card"><h2>Pagos</h2><div id="payments"></div><button id="more-payments" class="secondary" hidden>Más pagos</button></article><article class="card"><h2>Facturas</h2><div id="invoices"></div><button id="more-invoices" class="secondary" hidden>Más facturas</button></article></div><article class="card"><h2>Mis disputas</h2><form id="open-dispute"><label>ID del cobro<input name="cobro_id" required></label><label>Motivo<input name="motivo" required maxlength="1000"></label><button>Abrir disputa</button></form><button id="reload-disputes" class="secondary">Actualizar</button><div id="driver-disputes"></div><button id="more-disputes" class="secondary" hidden>Más disputas</button></article></section>
<section id="operator" hidden><h1>Pasos de mi peaje</h1><p id="operator-toll"></p><article class="card"><label>Fecha de Guatemala<input type="date" id="date"></label><button id="reload-operator" class="secondary">Actualizar</button><span id="connection"></span><div id="operator-passes"></div><button id="more-operator" class="secondary" hidden>Más pasos</button></article></section>
<section id="attention" class="card" hidden><h1>Atención: disputas abiertas</h1><button id="reload-attention" class="secondary">Actualizar</button><div id="attention-disputes"></div><button id="more-attention" class="secondary" hidden>Más disputas</button><form id="resolve-dispute"><label>ID de la disputa<input name="disputa_id" required></label><label>Decisión<select name="decision"><option value="APROBAR">Aprobar</option><option value="RECHAZAR">Rechazar</option></select></label><label>Motivo<input name="motivo" required maxlength="1000"></label><button>Resolver</button></form></section>
<section id="other-role" class="card" hidden><h1 id="role-heading">GuatePass</h1><p>Sesión iniciada.</p></section></main>
<script type="module" src="/app.js"></script></body></html>
